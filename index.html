<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="./js/lib/jquery-4.0.0.min.js"></script>
  <script defer src="./js/main.js"></script>
  <link rel="stylesheet" href="./css/style.css">
  <title>Frontend Mentor | Tip calculator app</title>
</head>

<body>
  <main class="container">
    <h1 class="title" aria-label="Splitter">
      <img src="./images/logo.svg" alt="Splitter" class="hero-logo">
    </h1>
    <div class="calculator">
      <form action="" class="calculator__form">
        <div class="label-row">
          <!-- 오류 메세지를 라벨과 연결(JS) -->
          <label for="bill">Bill</label>
          <span id="bill-error" class="error">Must be greater than zero</span>
        </div>
        <div class="input-group">
          <!-- 음수 입력 방지, 소수점 둘째 자리까지 입력 허용 (또는 step="any")   -->
          <input type="number" id="bill" name="bill" placeholder="0" step="0" min="0.01" aria-invalid="false">
        </div>
        <!-- 웹 폼(양식) 관련 컨트롤 요소와 레이블(<label> 태그로 만든 이름표)을 그룹화해서 묶은 세트 -->
        <fieldset>
          <!-- 부모 요소인 <fieldset> 태그로 그룹화해서 세트로 묶은 요소들에 대한 캡션(간단한 제목이나 설명)을 나타내기 위해 사용하는 태그 -->
          <legend>Select Tip %</legend>
          <ul>
            <li><label><input type="radio" name="tip" class="sr-only" value="5">5%</label></li>
            <li><label><input type="radio" name="tip" class="sr-only" value="10">10%</label></li>
            <li><label><input type="radio" name="tip" class="sr-only" value="15">15%</label></li>
            <li><label><input type="radio" name="tip" class="sr-only" value="25">25%</label></li>
            <li><label><input type="radio" name="tip" class="sr-only" value="50">50%</label></li>
            <li>
              <!-- placeholder는 입력하면 사라지므로, 입력 목적을 알려주는 label을 별도로 연결 -->
              <label for="custom" class="sr-only">Custom tip percentage</label>
              <input type="number" id="custom" name="custom" placeholder="Custom">
            </li>
          </ul>
        </fieldset>

        <div class="label-row">
          <label for="people">Number of People</label>
          <span id="people-error" class="error">Must be a positive whole number</span>
        </div>
        <div class="input-group">
          <input type="number" id="people" name="people" placeholder="0" aria-invalid="false">
        </div>
      </form>
      <section class="calculator__result">
        <div class="output-tip">
          <div class="text-group">
            <p>Tip Amount</p>
            <span>/ person</span>
          </div>
          <!-- 웹 애플리케이션이 수행한 계산 결과나 사용자의 웹 폼(양식) 관련 컨트롤 요소를 통한 다양한 상호작용의 결과에 대한 출력(output)을 나타냅니다  -->
          <output class="tip">$0.00</output>
        </div>
        <div class="output-result">
          <div class="text-group">
            <p>Total</p>
            <span>/ person</span>
          </div>
          <output class="result">$0.00</output>
        </div>
        <button value="reset" class="reset-btn">Reset</button>
      </section>
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/jonghwascript">jonghwascript</a>.
  </footer>
</body>

</html>
